name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test APK (debug)
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Final APK + AAB (release)
        continue-on-error: true
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secrets are missing - only the debug APK was built."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > app/release.keystore
          keytool -list -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null \
            || { echo "::error::Wrong KEYSTORE_PASSWORD or KEYSTORE_BASE64"; rm -f app/release.keystore; exit 1; }
          gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: kathara-xeria-app
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
